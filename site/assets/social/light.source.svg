<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title"><title id="title">Northline Appointments — Make time to talk.</title><rect width="1200" height="630" fill="#f1f5e9"/><rect x="32" y="32" width="1136" height="566" rx="40" fill="#e7eedf" stroke="#aebeac"/><g transform="translate(76 72) scale(.625)" color="#354b39" fill="#354b39"><rect x="10" y="15" width="44" height="39" rx="5" fill="none" stroke="currentColor" stroke-width="6"/><path d="M20 8v14M44 8v14M12 29h40M22 41h2M39 41h2" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round"/></g><text x="130" y="101" fill="#354b39" font-family="Inter" font-size="26" font-weight="400" text-anchor="start">Northline Appointments</text><text x="943.8935546875" y="99" fill="#50654f" font-family="Inter" font-size="18" font-weight="400" text-anchor="start">Time for a good idea</text><text x="80" y="344.06" fill="#354b39" font-family="Inter" font-size="76" font-weight="600" text-anchor="start">Make time to talk.</text><text x="80" y="500" fill="#50654f" font-family="Inter" font-size="26" font-weight="400" text-anchor="start">Discovery conversations, design consultations</text><text x="80" y="534" fill="#50654f" font-family="Inter" font-size="26" font-weight="400" text-anchor="start">and project reviews. Requests need owner review.</text></svg>
